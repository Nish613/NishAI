<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NishAI</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />

  <!-- Marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Highlight.js for code syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Background canvas for animated grid -->
  <canvas id="bg-canvas"></canvas>

  <!-- Overlay for mobile sidebar -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">⬡</span>
        <span class="logo-text">NishAI</span>
      </div>
      <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>

    <nav class="feature-nav">
      <p class="nav-label">Features</p>

      <button class="feature-btn active" data-feature="explain">
        <div class="feature-info">
          <span class="feature-name">Explain a Concept</span>
          <span class="feature-desc">Break down complex ideas simply</span>
        </div>
      </button>

      <button class="feature-btn" data-feature="summarize">
        <div class="feature-info">
          <span class="feature-name">Summarize Text</span>
          <span class="feature-desc">Condense long content</span>
        </div>
      </button>

      <button class="feature-btn" data-feature="bullets">
        <div class="feature-info">
          <span class="feature-name">Convert to Bullets</span>
          <span class="feature-desc">Structured key points</span>
        </div>
      </button>
    </nav>

    <div class="sidebar-footer">
      <button class="clear-history-btn" id="clearHistory">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14H6L5 6"/>
          <path d="M10 11v6M14 11v6"/>
        </svg>
        Clear History
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main" id="main">

    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" id="mobileMenuBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div>
          <h1 class="current-feature-title" id="currentFeatureTitle">Explain a Concept</h1>
          <p class="current-feature-subtitle" id="currentFeatureSubtitle">Break down complex ideas into clear, understandable explanations</p>
        </div>
      </div>
      <div class="topbar-right">
        <div class="model-badge">
          <span class="model-dot"></span>
          Gemini 1.5 Flash
        </div>
      </div>
    </header>

    <!-- Chat window -->
    <section class="chat-window" id="chatWindow">
      <div class="welcome-state" id="welcomeState">
        <div class="welcome-icon">⬡</div>
        <h2>Select a feature and start exploring</h2>
        <p>Choose a tool from the sidebar, type your input, and let AI do the heavy lifting.</p>
      </div>
    </section>

    <!-- Input area -->
    <footer class="input-area">
      <div class="input-wrapper">
        <textarea
          id="userInput"
          class="user-input"
          placeholder="Type your input here… (Shift+Enter for new line, Enter to send)"
          rows="1"
        ></textarea>
        <div class="input-actions">
          <span class="char-count" id="charCount">0</span>
          <button class="send-btn" id="sendBtn" title="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
      </div>
      <p class="input-hint">Currently using: <strong id="activeFeatureLabel">Explain a Concept</strong></p>
    </footer>
  </main>

  <script src="js/config.js"></script>
  <script src="js/prompts.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
